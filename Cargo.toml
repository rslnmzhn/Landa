[workspace]
resolver = "2"
members = [
    "crates/landa-proto",
    "crates/landa-core",
    "crates/landa-mod-shares",
    "crates/landa-mod-clipboard",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Landa Contributors"]

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
if-addrs = "0.13"
postcard = { version = "1.1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"
thiserror = "2.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"
x509-parser = "0.16"
