<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Orb background gradient -->
    <radialGradient id="orbBg" cx="48%" cy="36%" r="62%" fx="46%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="58%" stop-color="#faf5ff" />
      <stop offset="84%" stop-color="#ede9fe" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </radialGradient>

    <!-- Outer rim / crescent shadow -->
    <linearGradient id="rimGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.75" />
    </linearGradient>

    <!-- Bottom inner crescent -->
    <linearGradient id="bottomCrescent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.55" />
    </linearGradient>

    <!-- Signal arcs gradient -->
    <linearGradient id="arcGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <!-- Arc glossy highlight -->
    <linearGradient id="arcHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#f3e8ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Petal gradients -->
    <linearGradient id="petalDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="petalMid" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="petalLight" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <clipPath id="orbClip">
      <circle cx="256" cy="256" r="224" />
    </clipPath>
  </defs>

  <!-- Main circular badge -->
  <g clip-path="url(#orbClip)">
    <circle cx="256" cy="256" r="224" fill="url(#orbBg)" />

    <!-- Subtle side & bottom crescent shading -->
    <path d="M 32 256 A 224 224 0 0 0 480 256 A 206 196 0 0 1 32 256 Z" fill="url(#bottomCrescent)" />
    <path d="M 44 190 A 224 224 0 0 0 468 190 A 214 214 0 0 1 44 190 Z" fill="#c084fc" opacity="0.14" />

    <!-- Top glossy highlight -->
    <ellipse cx="256" cy="118" rx="148" ry="68" fill="#ffffff" opacity="0.45" />

    <!-- Three Wi-Fi / signal arcs -->
    <g fill="none" stroke-linecap="round" transform="translate(0, -22)">
      <!-- Outer arc -->
      <path d="M 114 176 A 176 176 0 0 1 398 176" stroke="url(#arcGrad)" stroke-width="26" />
      <path d="M 120 170 A 176 176 0 0 1 392 170" stroke="url(#arcHighlight)" stroke-width="7" />

      <!-- Middle arc -->
      <path d="M 152 212 A 128 128 0 0 1 360 212" stroke="url(#arcGrad)" stroke-width="25" />
      <path d="M 158 206 A 128 128 0 0 1 354 206" stroke="url(#arcHighlight)" stroke-width="6.5" />

      <!-- Inner arc -->
      <path d="M 192 248 A 82 82 0 0 1 320 248" stroke="url(#arcGrad)" stroke-width="24" />
      <path d="M 198 242 A 82 82 0 0 1 314 242" stroke="url(#arcHighlight)" stroke-width="6" />
    </g>

    <!-- Lavender flower spike -->
    <g id="lavender-spike">
      <!-- Stem -->
      <path d="M 251 482 L 252 330 L 260 330 L 261 482 Z" fill="url(#stemGrad)" />

      <!-- Back/outer dark buds (bottom to top) -->
      <ellipse cx="224" cy="412" rx="14" ry="24" transform="rotate(-34 224 412)" fill="url(#petalDark)" />
      <ellipse cx="288" cy="412" rx="14" ry="24" transform="rotate(34 288 412)" fill="url(#petalDark)" />

      <ellipse cx="216" cy="376" rx="13" ry="23" transform="rotate(-38 216 376)" fill="url(#petalDark)" />
      <ellipse cx="296" cy="376" rx="13" ry="23" transform="rotate(38 296 376)" fill="url(#petalDark)" />

      <ellipse cx="218" cy="340" rx="12" ry="21" transform="rotate(-34 218 340)" fill="url(#petalDark)" />
      <ellipse cx="294" cy="340" rx="12" ry="21" transform="rotate(34 294 340)" fill="url(#petalDark)" />

      <ellipse cx="224" cy="306" rx="11" ry="19" transform="rotate(-28 224 306)" fill="url(#petalDark)" />
      <ellipse cx="288" cy="306" rx="11" ry="19" transform="rotate(28 288 306)" fill="url(#petalDark)" />

      <ellipse cx="232" cy="274" rx="10" ry="17" transform="rotate(-22 232 274)" fill="url(#petalDark)" />
      <ellipse cx="280" cy="274" rx="10" ry="17" transform="rotate(22 280 274)" fill="url(#petalDark)" />

      <ellipse cx="240" cy="246" rx="9" ry="15" transform="rotate(-16 240 246)" fill="url(#petalDark)" />
      <ellipse cx="272" cy="246" rx="9" ry="15" transform="rotate(16 272 246)" fill="url(#petalDark)" />

      <!-- Mid-layer buds -->
      <ellipse cx="236" cy="422" rx="12" ry="21" transform="rotate(-22 236 422)" fill="url(#petalMid)" />
      <ellipse cx="276" cy="422" rx="12" ry="21" transform="rotate(22 276 422)" fill="url(#petalMid)" />

      <ellipse cx="232" cy="386" rx="12" ry="21" transform="rotate(-24 232 386)" fill="url(#petalMid)" />
      <ellipse cx="280" cy="386" rx="12" ry="21" transform="rotate(24 280 386)" fill="url(#petalMid)" />

      <ellipse cx="234" cy="350" rx="11" ry="19" transform="rotate(-20 234 350)" fill="url(#petalMid)" />
      <ellipse cx="278" cy="350" rx="11" ry="19" transform="rotate(20 278 350)" fill="url(#petalMid)" />

      <ellipse cx="238" cy="316" rx="10" ry="18" transform="rotate(-16 238 316)" fill="url(#petalMid)" />
      <ellipse cx="274" cy="316" rx="10" ry="18" transform="rotate(16 274 316)" fill="url(#petalMid)" />

      <ellipse cx="243" cy="284" rx="9.5" ry="16" transform="rotate(-12 243 284)" fill="url(#petalMid)" />
      <ellipse cx="269" cy="284" rx="9.5" ry="16" transform="rotate(12 269 284)" fill="url(#petalMid)" />

      <ellipse cx="247" cy="254" rx="8.5" ry="14" transform="rotate(-8 247 254)" fill="url(#petalMid)" />
      <ellipse cx="265" cy="254" rx="8.5" ry="14" transform="rotate(8 265 254)" fill="url(#petalMid)" />

      <!-- Front/center highlighted buds -->
      <ellipse cx="256" cy="428" rx="11" ry="19" fill="url(#petalLight)" />
      <ellipse cx="246" cy="396" rx="10.5" ry="18" transform="rotate(-10 246 396)" fill="url(#petalLight)" />
      <ellipse cx="266" cy="396" rx="10.5" ry="18" transform="rotate(10 266 396)" fill="url(#petalLight)" />

      <ellipse cx="256" cy="366" rx="11" ry="19" fill="url(#petalLight)" />
      <ellipse cx="247" cy="334" rx="10" ry="17" transform="rotate(-8 247 334)" fill="url(#petalLight)" />
      <ellipse cx="265" cy="334" rx="10" ry="17" transform="rotate(8 265 334)" fill="url(#petalLight)" />

      <ellipse cx="256" cy="304" rx="10" ry="17" fill="url(#petalLight)" />
      <ellipse cx="249" cy="274" rx="9" ry="15" transform="rotate(-6 249 274)" fill="url(#petalLight)" />
      <ellipse cx="263" cy="274" rx="9" ry="15" transform="rotate(6 263 274)" fill="url(#petalLight)" />

      <!-- Top crown bud -->
      <ellipse cx="256" cy="234" rx="9.5" ry="17" fill="url(#petalMid)" />
      <ellipse cx="256" cy="232" rx="6.5" ry="12" fill="url(#petalLight)" />
    </g>
  </g>

  <!-- Crisp outer ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#rimGrad)" stroke-width="3" />
</svg>
